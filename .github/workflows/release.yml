name: Release

# Builds and attaches a DMG whenever a v* tag is pushed.
#
# The workflow_dispatch trigger exists so a failed release can be retried without
# deleting and re-pushing the tag: dispatch this workflow with the tag as input and it
# rebuilds the DMG and re-attaches it to the same release. `scripts/publish-release.sh`
# is idempotent, so retrying is always safe and never duplicates the asset.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.5.0 (must already exist)"
        required: true
        type: string

# One release at a time. Without this, a tag push and a manual dispatch for the same tag
# can run concurrently and race each other on the same release.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Resolve the tag first, so the checkout below can pin to it. On a dispatch the
      # workflow itself runs from the branch that was dispatched (usually main), which is
      # not necessarily what the tag points at — building that would ship code the tag
      # does not describe.
      - name: Resolve tag
        id: tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${DISPATCH_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::expected a tag like v0.5.0, got '$tag'"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      # Full history so the tag is present, and pinned to the tag itself rather than the
      # dispatched branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.value }}

      - name: Verify tag
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::tag $TAG does not exist. Push it before dispatching a release."
            exit 1
          fi
          echo "Building $TAG at $(git rev-parse --short "refs/tags/$TAG^{commit}")"

      - run: swift --version

      - name: Build, package, and create DMG
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: bash scripts/release.sh "${TAG#v}"

      # The publish step is tooling, not the app, so it must not be versioned by the tag:
      # a tag cut before publish-release.sh existed would otherwise fail with "command not
      # found". Always take it from the default branch, which carries the current version.
      - name: Fetch release tooling from the default branch
        env:
          TOOLING_REF: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$TOOLING_REF" --depth=1
          git show "origin/$TOOLING_REF:scripts/publish-release.sh" > scripts/publish-release.sh
          chmod +x scripts/publish-release.sh

      - name: Publish release with DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: bash scripts/publish-release.sh "$TAG"